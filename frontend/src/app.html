<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
		/>
		<script>
			(function () {
				function readCookie(name) {
					const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
					return match ? decodeURIComponent(match[1]) : null;
				}
				const theme =
					readCookie('ropa_theme') ||
					(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				if (theme === 'dark') document.documentElement.classList.add('dark');
				const locale = readCookie('ropa_locale');
				if (locale) document.documentElement.setAttribute('lang', locale);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-surface text-body antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Wave 1: fast, cheap checks — run immediately, in parallel ----

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact -v

  workspace-build:
    name: Workspace — install, typecheck, build
    runs-on: ubuntu-latest
    env:
      BACKEND_ORIGIN: http://localhost:4000
      DATABASE_URL: postgresql://ropa:ropa@localhost:5433/ropa_ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # ---- Wave 2: deeper scans — only once the code actually builds ----

  backend-test:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    needs: [workspace-build]
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: ropa
          POSTGRES_PASSWORD: ropa
          POSTGRES_DB: ropa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ropa -d ropa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ropa:ropa@localhost:5433/ropa_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -- --filter=ropa-backend

  dependency-scan:
    name: Dependency scan (npm audit) — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    needs: [workspace-build]
    strategy:
      matrix:
        workspace: [ropa-backend, ropa-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --workspace=${{ matrix.workspace }}

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: [workspace-build]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  # ---- Wave 3: most expensive — build the real Docker images and scan them ----

  docker-scan:
    name: Build images & scan with Trivy
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-codeql, backend-test]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ropa-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t ropa-frontend:ci .

      - name: Scan backend image (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: ropa-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan frontend image (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: ropa-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan filesystem for misconfigurations (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

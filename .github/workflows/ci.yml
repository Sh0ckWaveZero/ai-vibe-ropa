name: CI · Build, Test, and Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Wave 1: fast, cheap checks — run immediately, in parallel ----

  secret-scan:
    name: Security · Scan Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan Git history for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 detect \
            --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact -v

  backend-build:
    name: Backend · Generate Client and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma v7 evaluates prisma.config.ts even when generate does not connect.
      DATABASE_URL: postgresql://ropa:ropa@localhost:5433/ropa_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Type-check and build backend
        run: npm run build

  frontend-build:
    name: Frontend · Check and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_ORIGIN: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Svelte and TypeScript checks
        run: npm run check
      - name: Build frontend
        run: npm run build

  # ---- Wave 2: deeper scans — only once the code actually builds ----

  backend-test:
    name: Backend · Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-build]
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: ropa
          POSTGRES_PASSWORD: ropa
          POSTGRES_DB: ropa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ropa -d ropa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ropa:ropa@localhost:5433/ropa_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Run integration tests against PostgreSQL
        run: npm test

  dependency-scan:
    name: Dependencies · Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-build, frontend-build]
    strategy:
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install ${{ matrix.project }} dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

  sast-codeql:
    name: Security · Analyze Source (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-build, frontend-build]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL for JavaScript and TypeScript
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
      - name: Analyze source code
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

  # ---- Wave 3: most expensive — build the real Docker images and scan them ----

  docker-scan:
    name: Containers · Build and Scan Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secret-scan, dependency-scan, sast-codeql, backend-test]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend image
        run: docker build -t ropa-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ropa-frontend:ci ./frontend

      - name: Scan backend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ropa-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ropa-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan repository misconfigurations (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

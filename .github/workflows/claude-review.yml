name: PR · AI Code Review (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: Review · Security and Correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        if: env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review this pull request's diff for the ROPA project — an Express +
            Prisma backend and a SvelteKit frontend implementing a GDPR/PDPA
            Record of Processing Activities system with role-based permissions
            and TOTP two-factor auth. Read CLAUDE.md first for project
            conventions.

            Focus on, in order of severity:
            1. Security: auth/permission-matrix bypass, injection, secret or
               TOTP-secret leakage, missing input validation, unsafe cookie/
               session handling, anything that would let a request skip
               `requireAuth`/`requireAnyPermission`/`requirePreAuth`.
            2. Correctness bugs introduced by this diff.
            3. Deviations from the module pattern and conventions documented
               in CLAUDE.md.

            Leave one PR review comment summarizing findings, ranked by
            severity, with file:line references. If nothing significant is
            found, say so briefly — do not invent issues to fill space.

      - name: Skip review when Claude credentials are unavailable
        if: env.ANTHROPIC_API_KEY == '' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::AI review skipped because no Claude credential is configured."
